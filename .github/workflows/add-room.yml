name: Add room (repository_dispatch)

# Déclenché par un POST sur /repos/OWNER/REPO/dispatches avec un token.
# Aucun login : le token seul suffit (Contents: read & write).
#   event_type = "add-room"
#   client_payload = { title, category, platform, difficulty, status, icon, tags[], summary, body }

on:
  repository_dispatch:
    types: [add-room]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Écrire la note depuis le payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/write-room.mjs

      - name: Régénérer l'index
        run: node scripts/build-index.mjs

      - name: Commit & push
        env:
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          git config user.name "cyber-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "room: ${TITLE:-nouvelle note} (via agent)"
            git push
          fi

      - name: Préparer le dossier à publier
        run: |
          mkdir -p _site
          cp -r index.html sw.js assets content _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
