name: Ingest note (repository_dispatch)

# Déclenché par un POST sur /repos/OWNER/REPO/dispatches avec un token seul
# (Contents: read & write). Deux gestes, un seul mécanisme :
#   event_type "add-room"   -> créer une nouvelle note / room
#   event_type "contribute" -> compléter une note existante (append / after / replace)
# client_payload :
#   { target?, op?, after?, title?, category?, platform?, difficulty?,
#     status?, icon?, tags[], summary?, body }

on:
  repository_dispatch:
    types: [add-room, contribute, update-note]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Créer ou mettre à jour la note
        id: note
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/write-note.mjs

      - name: Régénérer l'index
        run: node scripts/build-index.mjs

      - name: Commit & push
        env:
          TITLE: ${{ github.event.client_payload.title }}
          TARGET: ${{ github.event.client_payload.target }}
          ACTION: ${{ steps.note.outputs.action }}
        run: |
          git config user.name "cyber-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "notes: ${ACTION:-update} ${TARGET:-${TITLE:-note}} (via agent)"
            git push
          fi

      - name: Préparer le dossier à publier
        run: |
          mkdir -p _site
          cp -r index.html sw.js assets content _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
