<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cyber Lab</title>
  <meta name="description" content="Cyber lab : notes de cybersécurité offensive, cheatsheets par sujet et write-ups de box (TryHackMe, HTB), rangés et cherchables. Mis à jour au fil des rooms.">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f0e9" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <!-- Open Graph -->
  <meta property="og:title" content="Cyber Lab">
  <meta property="og:description" content="Notes de cybersécurité offensive : cheatsheets par sujet et write-ups de box, rangés et cherchables.">
  <meta property="og:type" content="website">

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <link rel="manifest" href="assets/manifest.webmanifest">

  <!-- Thème appliqué avant le rendu (évite le flash) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('clab-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-name"><span class="brand-prompt">~/</span>cyber-lab</span>
        <span class="brand-sub">Arthur Jeaugey</span>
      </a>
      <button class="search-field" id="search-trigger" type="button">
        <span>rechercher…</span><span class="kbd">⌘K</span>
      </button>
      <nav class="nav" id="nav" aria-label="Sommaire du lab"></nav>
      <div class="sidebar-foot">
        <button class="text-btn" id="add-btn-side" type="button">+ ajouter une note</button>
        <a class="text-btn" href="https://github.com/a-jeaugey/cyber-lab" target="_blank" rel="noopener noreferrer">source ↗</a>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="tb-btn hamburger" id="hamburger" type="button" aria-label="Menu">menu</button>
        <nav class="crumbs" id="crumbs" aria-label="Fil d'Ariane"></nav>
        <div class="topbar-spacer"></div>
        <button class="tb-btn" id="search-btn" type="button" title="Rechercher (Ctrl+K)">rechercher <span class="kbd">⌘K</span></button>
        <button class="tb-btn" id="theme-btn" type="button" title="Changer de thème">thème</button>
        <button class="tb-btn" id="add-btn-top" type="button" title="Ajouter une note" aria-label="Ajouter une note">+</button>
        <div class="progress" id="progress"></div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>

  <!-- COMMAND PALETTE -->
  <div class="palette-backdrop" id="palette">
    <div class="palette" role="dialog" aria-modal="true" aria-label="Recherche">
      <div class="palette-input-row">
        <span class="pi-prompt">›</span>
        <input id="palette-input" type="text" placeholder="commande, outil, notion, room…" autocomplete="off" spellcheck="false" aria-label="Recherche">
        <span class="kbd">esc</span>
      </div>
      <div class="palette-results" id="palette-results"></div>
      <div class="palette-foot">
        <span><span class="kbd">↑↓</span> naviguer</span>
        <span><span class="kbd">↵</span> ouvrir</span>
        <span><span class="kbd">esc</span> fermer</span>
      </div>
    </div>
  </div>

  <!-- MODAL (rempli par ingest.js) -->
  <div class="modal-backdrop" id="modal"></div>

  <script type="module" src="assets/js/app.js"></script>
  <script>
    // Service worker (offline). Silencieux si non supporté / non servi en HTTPS.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
